<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CaseStudio Open</title>
<meta name="description" content="Generatore parametrico di cover per telefono stampabili in 3D su Bambu Lab A1 mini, senza AMS.">
<meta name="theme-color" content="#0b1018">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='2' width='18' height='28' rx='5' fill='none' stroke='%233d8bff' stroke-width='2.4'/%3E%3Crect x='10' y='5' width='7' height='7' rx='2.5' fill='%233d8bff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>

<main class="stage">
  <canvas id="cv" aria-label="Anteprima 3D della cover"></canvas>

  <div class="toolbar glass" role="toolbar" aria-label="Vista">
    <button class="tb" data-view="back" title="Retro"><svg class="i"><use href="sprite.svg#smartphone"/></svg><span>Retro</span></button>
    <button class="tb" data-view="front" title="Fronte"><svg class="i"><use href="sprite.svg#scan-line"/></svg><span>Fronte</span></button>
    <button class="tb" data-view="side" title="Lato"><svg class="i"><use href="sprite.svg#layers"/></svg><span>Lato</span></button>
    <button class="tb" data-view="angle" title="3D"><svg class="i"><use href="sprite.svg#rotate-3d"/></svg><span>3D</span></button>
    <i class="sep"></i>
    <button class="tb toggle" id="tgExplode" aria-pressed="false" title="Vista esplosa"><svg class="i"><use href="sprite.svg#move-3d"/></svg><span>Esplodi</span></button>
    <button class="tb toggle" id="tgPhone" aria-pressed="false" title="Mostra il telefono"><svg class="i"><use href="sprite.svg#eye"/></svg><span>Telefono</span></button>
  </div>

  <div class="status glass" id="status" role="status" aria-live="polite">
    <svg class="i spin" id="stSpin"><use href="sprite.svg#loader-circle"/></svg>
    <span id="stText">Avvio motore 3D…</span>
  </div>
</main>

<aside class="panel glass" id="panel">
  <header class="ph">
    <div class="brand"><span class="logo"></span><div><b>CaseStudio</b><small>Open · A1 mini · senza AMS</small></div></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="body" id="body"></div>
  <footer class="pf">
    <div class="info" id="info"></div>
    <button class="btn primary" id="goExport"><svg class="i"><use href="sprite.svg#download"/></svg>Esporta</button>
  </footer>
</aside>

<div class="toast glass" id="toast" role="alert" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<script type="module" src="js/ui.js"></script>
</body>
</html>
