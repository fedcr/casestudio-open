<!doctype html>
<html lang="en">
<!-- avoid-ai-design-ignore: K7 (gli stili :focus-visible sono in css/style.css) -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CaseStudio Open</title>
<meta name="description" content="Generatore parametrico di cover per telefono in due pezzi, stampabili su Bambu Lab A1 mini senza AMS.">
<meta name="theme-color" content="#d9dde0">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<main class="stage">
  <canvas id="cv" tabindex="0" data-i18n-aria="Anteprima 3D della cover sul piano di stampa. Trascina per ruotare, rotella per lo zoom."></canvas>

  <div class="brandbar glass">
    <img src="assets/logo.svg" alt="" width="32" height="32">
    <div><b>CaseStudio Open</b><small data-i18n="Cover in due pezzi per A1 mini, senza AMS"></small></div>
    <label class="lang"><svg class="i" aria-hidden="true"><use href="sprite.svg#languages"/></svg><select id="lang"></select></label>
  </div>

  <div class="views glass" role="toolbar" data-i18n-aria="Vista">
    <button class="tb" data-view="angle" data-i18n-aria="Vista prospettica"><svg class="i"><use href="sprite.svg#rotate-3d"/></svg><span data-i18n="3D"></span></button>
    <button class="tb" data-view="back" data-i18n-aria="Vista dall'alto, retro della cover"><svg class="i"><use href="sprite.svg#smartphone"/></svg><span data-i18n="Retro"></span></button>
    <button class="tb" data-view="side" data-i18n-aria="Vista laterale"><svg class="i"><use href="sprite.svg#layers"/></svg><span data-i18n="Lato"></span></button>
    <button class="tb" data-view="front" data-i18n-aria="Vista da sotto, lato schermo"><svg class="i"><use href="sprite.svg#scan-line"/></svg><span data-i18n="Schermo"></span></button>
    <i class="sep" aria-hidden="true"></i>
    <button class="tb" id="tgExplode" aria-pressed="false"><svg class="i"><use href="sprite.svg#move-3d"/></svg><span data-i18n="Separa i pezzi"></span></button>
    <button class="tb" id="tgPhone" aria-pressed="false"><svg class="i"><use href="sprite.svg#eye"/></svg><span data-i18n="Telefono"></span></button>
  </div>

  <div class="status glass" id="status" role="status" aria-live="polite">
    <svg class="i spin" id="stSpin"><use href="sprite.svg#loader-circle"/></svg>
    <span id="stText" data-i18n="Avvio del motore 3D"></span>
  </div>
</main>

<aside class="panel glass" id="panel" data-i18n-aria="Impostazioni della cover">
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="body" id="body"></div>
  <footer class="pf">
    <div>
      <div class="info" id="info" data-i18n="Calcolo in corso"></div>
      <a class="maker" href="https://github.com/fedcr/casestudio-open" target="_blank" rel="noopener"><img src="assets/everythink.png" alt="" width="18" height="18"><span data-i18n="Un progetto EveryThink"></span></a>
    </div>
    <button class="btn primary" id="goExport"><svg class="i"><use href="sprite.svg#download"/></svg><span data-i18n="Esporta"></span></button>
  </footer>
</aside>

<div class="toast glass" id="toast" role="alert" hidden></div>
<input type="file" id="file" accept="image/*,.svg" class="vh">
<script type="module" src="js/ui.js"></script>
</body>
</html>
